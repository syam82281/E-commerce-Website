name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Image Tag
        run: |
          echo "TAG=$(date +'%d%m%y')" >> $GITHUB_ENV

      - name: Build Frontend
        run: |
          docker build -t localhost:5000/ecommerce-frontend:${{ env.TAG }} ./client

      - name: Build Backend
        run: |
          docker build -t localhost:5000/ecommerce-backend:${{ env.TAG }} ./server

      - name: Push Frontend Image
        run: |
          docker push localhost:5000/ecommerce-frontend:${{ env.TAG }}

      - name: Push Backend Image
        run: |
          docker push localhost:5000/ecommerce-backend:${{ env.TAG }}

      - name: Deploy with Helm
        run: |
          helm upgrade --install ecommerce ./ecommerce-chart \
            --namespace ecommerce \
            --create-namespace \
            --set frontend.image.repository=localhost:5000/ecommerce-frontend \
            --set frontend.image.tag=${{ env.TAG }} \
            --set backend.image.repository=localhost:5000/ecommerce-backend \
            --set backend.image.tag=${{ env.TAG }}

      - name: Wait for Frontend Rollout
        run: |
          kubectl rollout status deployment/frontend -n ecommerce

      - name: Wait for Backend Rollout
        run: |
          kubectl rollout status deployment/backend -n ecommerce

      - name: Verify Pods
        run: |
          kubectl get pods -n ecommerce

      - name: Verify Services
        run: |
          kubectl get svc -n ecommerce

      - name: Verify Helm Release
        run: |
          helm list -n ecommerce
