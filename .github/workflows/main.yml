name: E-commerce CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    env:
      REGISTRY: localhost:5000
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set KUBECONFIG
        run: |
          echo "KUBECONFIG=$HOME/.kube/config" >> $GITHUB_ENV

      - name: Verify Docker
        run: docker version

      - name: Verify Kubernetes
        env:
          KUBECONFIG: /home/ec2-user/.kube/config
        run: |
          kubectl get nodes

      - name: Build Frontend Image
        run: |
          docker build \
            -t $REGISTRY/ecommerce-frontend:$IMAGE_TAG \
            -t $REGISTRY/ecommerce-frontend:latest \
            ./client

      - name: Build Backend Image
        run: |
          docker build \
            -t $REGISTRY/ecommerce-backend:$IMAGE_TAG \
            -t $REGISTRY/ecommerce-backend:latest \
            ./server

      - name: Push Frontend Image
        run: |
          docker push $REGISTRY/ecommerce-frontend:$IMAGE_TAG
          docker push $REGISTRY/ecommerce-frontend:latest

      - name: Push Backend Image
        run: |
          docker push $REGISTRY/ecommerce-backend:$IMAGE_TAG
          docker push $REGISTRY/ecommerce-backend:latest

      - name: Apply Kubernetes Manifests
        env:
          KUBECONFIG: /home/ec2-user/.kube/config
        run: |
          kubectl apply -f k8s/

      - name: Update Backend Image
        env:
          KUBECONFIG: /home/ec2-user/.kube/config
        run: |
          kubectl set image deployment/backend \
          backend=$REGISTRY/ecommerce-backend:$IMAGE_TAG \
          -n ecommerce

      - name: Update Frontend Image
        env:
          KUBECONFIG: /home/ec2-user/.kube/config
        run: |
          kubectl set image deployment/frontend \
          frontend=$REGISTRY/ecommerce-frontend:$IMAGE_TAG \
          -n ecommerce

      - name: Wait for Rollout
        env:
          KUBECONFIG: /home/ec2-user/.kube/config
        run: |
          kubectl rollout status deployment/backend -n ecommerce
          kubectl rollout status deployment/frontend -n ecommerce

      - name: Show Pods
        env:
          KUBECONFIG: /home/ec2-user/.kube/config
        run: |
          kubectl get pods -n ecommerce -o wide

      - name: Show Services
        env:
          KUBECONFIG: /home/ec2-user/.kube/config
        run: |
          kubectl get svc -n ecommerce
