name: E-commerce CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    env:
      REGISTRY: localhost:5000
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Docker
        run: docker version

      - name: Check Kubernetes
        run: kubectl get nodes

      - name: Build Frontend Image
        run: |
          docker build \
            -t $REGISTRY/ecommerce-frontend:$IMAGE_TAG \
            -t $REGISTRY/ecommerce-frontend:latest \
            ./client

      - name: Build Backend Image
        run: |
          docker build \
            -t $REGISTRY/ecommerce-backend:$IMAGE_TAG \
            -t $REGISTRY/ecommerce-backend:latest \
            ./server

      - name: Push Frontend Image
        run: |
          docker push $REGISTRY/ecommerce-frontend:$IMAGE_TAG
          docker push $REGISTRY/ecommerce-frontend:latest

      - name: Push Backend Image
        run: |
          docker push $REGISTRY/ecommerce-backend:$IMAGE_TAG
          docker push $REGISTRY/ecommerce-backend:latest

      - name: Create Namespace (if needed)
        run: |
          kubectl create namespace ecommerce --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply -f k8s/

      - name: Update Backend Image
        run: |
          kubectl set image deployment/backend \
            backend=$REGISTRY/ecommerce-backend:$IMAGE_TAG \
            -n ecommerce

      - name: Update Frontend Image
        run: |
          kubectl set image deployment/frontend \
            frontend=$REGISTRY/ecommerce-frontend:$IMAGE_TAG \
            -n ecommerce

      - name: Wait for Backend Rollout
        run: |
          kubectl rollout status deployment/backend -n ecommerce --timeout=180s

      - name: Wait for Frontend Rollout
        run: |
          kubectl rollout status deployment/frontend -n ecommerce --timeout=180s

      - name: Show Pods
        run: |
          kubectl get pods -n ecommerce -o wide

      - name: Show Services
        run: |
          kubectl get svc -n ecommerce

      - name: Show Deployment Images
        run: |
          kubectl get deployment backend -n ecommerce -o=jsonpath='{.spec.template.spec.containers[0].image}'
          echo
          kubectl get deployment frontend -n ecommerce -o=jsonpath='{.spec.template.spec.containers[0].image}'
          echo

      - name: Clean Docker Images
        run: |
          docker image prune -af
